syntax = "proto3";

package io.trino.plugin.tpch;

import "io/trino/protobuf/handles/v1/domain.proto";

option java_package = "io.trino.plugin.tpch.protobuf";
option java_multiple_files = true;

// Connector-owned handle payloads for protobuf control-plane encoding.
// The engine wraps these bytes in its ConnectorHandle message.

message TpchColumnHandle {
  string column_name = 1;
  string type_id = 2;
}

// One entry of the TupleDomain<ColumnHandle> constraint on a table handle.
// Domains use the shared Domain message, so a value of any tpch column type
// travels as a Trino block.
message TpchColumnDomain {
  TpchColumnHandle column = 1;
  io.trino.protobuf.handles.v1.Domain domain = 2;
}

message TpchTupleDomain {
  io.trino.protobuf.handles.v1.TupleDomainKind kind = 1;
  // only when kind is COLUMN_DOMAINS
  repeated TpchColumnDomain column_domains = 2;
}

message TpchTableHandle {
  string schema_name = 1;
  string table_name = 2;
  double scale_factor = 3;
  TpchTupleDomain constraint = 4;
}

message TpchSplit {
  int32 part_number = 1;
  int32 total_parts = 2;
  repeated string addresses = 3;
}

message TpchPartitioningHandle {
  string table = 1;
  int64 total_rows = 2;
}

message TpchTransactionHandle {
}
