syntax = "proto3";

package io.trino.server.protocol.v1;

option java_package = "io.trino.server.protocol.v1";
option java_multiple_files = true;

// Engine wrapper for a connector handle encoded by the owning catalog's
// ConnectorHandleCodecProvider. The payload is the connector's own protobuf
// message, resolved through the catalog handle on the receiving node. It is
// never JSON.
message ConnectorHandle {
  string catalog_handle = 1;
  bytes payload = 2;
}
